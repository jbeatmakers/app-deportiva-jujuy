name: Resolve Hostinger reset redirect securely

on:
  push:
    branches: ['agent/hostinger-reset-resolve-20260818']
    paths:
      - '.github/workflows/hostinger-reset-resolve.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hostinger-reset-resolve-20260818
          fetch-depth: 0
      - name: Open encrypted resolver session
        shell: bash
        run: |
          set -euo pipefail
          SESSION="$GITHUB_RUN_ID"
          mkdir -p .resolver
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/resolver-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/resolver-private.pem -pubout -out ".resolver/session-${SESSION}-public.pem" >/dev/null 2>&1
          cat > .resolver/assistant-public.pem <<'PUB'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA03EuMKs+6jDnnX/z2gWI
          /6oRV1DkzPA02WrDH5VavfP/Yk0uo+9bMYjp96bXfibSqHhX/mRrH/TqdJILMrMC
          s2zwXcz0beaN06nHOPfaYHYxmjShdphe/SZDe7XubJCGyWW4brKy50U5VFrALOD9
          AlOaYVv1OBL4CgXSs8XSr7UjnkOi8u53gtnr0ZMVQc2L6xnaOJN53cSqsw5Q8EBx
          N5oyazhln54Dl6x81AmbljNLk6LbLBS0gjvxkYmUbS1+AAVnbXr77e1pfUNkM4CI
          PHh/DtO6B+6tcvhpSWJb2w/4Ao6vbcEVkhc4z37OqKPFb4IwTAYAtHMS47+p8uqY
          uqz28AoDibTNHLU52qu40/d6wYbAGBf70U+wBzVHj+RR6culQVK+t6+4bLquaYTK
          5+OuA/t+bab9jhRB42xjpPMI1g+wzusYFKF2fsYgcXcHQkkh8803r4PK/mgqSJG9
          S2XeFnHP3oOylT3CdUJjR1P2a9jMfPW5pzzTQK14NExvAgMBAAE=
          -----END PUBLIC KEY-----
          PUB
          printf '{"run_id":"%s","state":"awaiting_click_url"}\n' "$SESSION" > .resolver/current-session.json
          git config user.name 'Hostinger Resolver Bot'
          git config user.email 'jbeatmakers@users.noreply.github.com'
          git add .resolver
          git commit -m "ops: open Hostinger reset resolver ${SESSION}"
          git push origin HEAD:agent/hostinger-reset-resolve-20260818
          echo "SESSION=$SESSION" >> "$GITHUB_ENV"
      - name: Receive encrypted tracking URL
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 120); do
            git fetch -q origin agent/hostinger-reset-resolve-20260818
            if git show "origin/agent/hostinger-reset-resolve-20260818:.resolver/url-${SESSION}.enc.b64" >/tmp/url.enc.b64 2>/dev/null; then found=1; break; fi
            sleep 5
          done
          test "$found" = 1
          base64 -d /tmp/url.enc.b64 >/tmp/url.enc
          openssl pkeyutl -decrypt -inkey /tmp/resolver-private.pem -in /tmp/url.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 >/tmp/click.url
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          u=Path('/tmp/click.url').read_text().strip()
          p=urlparse(u)
          if p.scheme!='https' or p.hostname!='clicks.hostinger.com': raise SystemExit('unexpected source URL')
          print('TRACKING_URL_VALID=true')
          PY
      - name: Resolve final Hostinger URL without consuming reset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error
          from pathlib import Path
          u=Path('/tmp/click.url').read_text().strip()
          req=urllib.request.Request(u,method='GET',headers={'User-Agent':'Mozilla/5.0 HostingerResetResolver/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  final=r.geturl()
          except urllib.error.HTTPError as e:
              final=e.geturl()
          if not final.startswith('https://auth.hostinger.com/password-reset?token='):
              raise SystemExit('unexpected final reset host/path')
          Path('/tmp/final.url').write_text(final)
          print('FINAL_RESET_URL_RESOLVED=true')
          PY
          openssl pkeyutl -encrypt -pubin -inkey .resolver/assistant-public.pem -in /tmp/final.url -out /tmp/final.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          git pull --rebase origin agent/hostinger-reset-resolve-20260818
          base64 -w0 /tmp/final.enc > ".resolver/result-${SESSION}.enc.b64"; printf '\n' >> ".resolver/result-${SESSION}.enc.b64"
          printf '{"run_id":"%s","state":"complete"}\n' "$SESSION" > .resolver/current-session.json
          git add ".resolver/result-${SESSION}.enc.b64" .resolver/current-session.json
          git commit -m "ops: publish encrypted resolved reset URL ${SESSION}"
          git push origin HEAD:agent/hostinger-reset-resolve-20260818
      - name: Destroy plaintext
        if: always()
        run: rm -f /tmp/resolver-private.pem /tmp/url.enc /tmp/url.enc.b64 /tmp/click.url /tmp/final.url /tmp/final.enc
